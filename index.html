    <!-- Instant blocking theme script to completely eliminate dark/light mode flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('btn_theme_mode_v1') || localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google Analytics (GA4) Script -->
    <script>
      (function() {
        var gaId = '%VITE_GA_MEASUREMENT_ID%' || window.localStorage.getItem('btn_custom_ga_measurement_id') || '';
        if (gaId && gaId.indexOf('%') === -1 && gaId.indexOf('G-') === 0) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){window.dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', gaId, { send_page_view: true });
        } else {
          window.dataLayer = window.dataLayer || [];
          window.gtag = function(){window.dataLayer.push(arguments);};
        }
      })();
    </script>
    <script>
      window.addEventListener('error', function (event) {
        if (event.error) {
          console.error('App Runtime Error:', event.error.message, event.error.stack);
        } else {
          console.warn('Unhandled Script Error:', event.message, event.filename, event.lineno);
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        console.warn('Unhandled Promise Rejection:', event.reason);
      });
    </script>
