<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-banking {
        font-family: 'Plus Jakarta Sans', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
      }
      .brand-tayari {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
      }
      .brand-motto {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- ==================== LEFT EMBLEM (STYLIZED B) ==================== -->
  <g id="brand-emblem" transform="translate(15, 12)">
    <!-- Main Navy Body of the letter 'B' -->
    <!-- Top stem & top bowl -->
    <path d="M 28 8 
             L 175 8 
             C 218 8, 252 32, 252 76 
             C 252 112, 222 136, 182 144 
             C 226 154, 254 186, 254 228 
             C 254 246, 246 264, 234 278 
             C 225 272, 212 266, 196 264 
             C 224 250, 236 232, 236 212 
             C 236 178, 210 156, 166 156 
             L 76 156 
             L 76 250 
             L 28 250 
             Z" 
          fill="#0B2046" />

    <!-- Upper bowl cutout (white D-shape) -->
    <path d="M 76 44 
             L 165 44 
             C 188 44, 206 56, 206 76 
             C 206 96, 188 110, 165 110 
             L 76 110 
             Z" 
          fill="#FFFFFF" />

    <!-- Open Book Pages (Navy Blue, fanning to bottom left) -->
    <!-- Bottom leaf -->
    <path d="M 12 312 C 45 292, 85 282, 126 280 C 126 270, 126 262, 126 256 C 76 260, 38 274, 12 312 Z" 
          fill="#0B2046" />
    <!-- Middle leaf -->
    <path d="M 20 288 C 52 268, 90 258, 128 255 C 128 247, 128 240, 128 234 C 84 238, 48 250, 20 288 Z" 
          fill="#0B2046" />
    <!-- Top leaf -->
    <path d="M 32 264 C 62 244, 98 234, 130 230 C 130 222, 130 216, 130 210 C 90 214, 56 226, 32 264 Z" 
          fill="#0B2046" />

    <!-- Red Swooshes / Flourish Pages (Crimson Red, curving to bottom right) -->
    <!-- Outer/Lower Red Swoop -->
    <path d="M 136 308 C 178 288, 222 266, 260 224 C 260 248, 246 280, 218 300 C 190 316, 160 316, 136 308 Z" 
          fill="#C8102E" />
    <!-- Inner/Upper Red Swoop -->
    <path d="M 138 288 C 170 270, 206 252, 238 224 C 238 240, 228 262, 208 278 C 184 292, 160 294, 138 288 Z" 
          fill="#C8102E" />

    <!-- Central White Fountain Pen Nib (Pointing Upwards) -->
    <g transform="translate(94, 154)">
      <!-- Fountain pen nib outer white body -->
      <path d="M 42 0 
               L 12 75 
               C 12 108, 24 135, 42 155 
               C 60 135, 72 108, 72 75 
               L 42 0 
               Z" 
            fill="#FFFFFF" 
            stroke="#0B2046" 
            stroke-width="3" 
            stroke-linejoin="round" />

      <!-- Nib breather hole -->
      <circle cx="42" cy="76" r="6.5" fill="#0B2046" />

      <!-- Nib slit line from breather hole to the tip at the top -->
      <line x1="42" y1="70" x2="42" y2="4" stroke="#0B2046" stroke-width="3.5" stroke-linecap="round" />

      <!-- Inner elegant contour curves of the nib -->
      <path d="M 26 78 C 26 98, 33 116, 42 130 C 51 116, 58 98, 58 78" 
            fill="none" 
            stroke="#0B2046" 
            stroke-width="2.5" />
    </g>
  </g>

  <!-- ==================== RIGHT BRAND TEXT ==================== -->
  <g transform="translate(305, 12)">
    <!-- "BANKING" Top Heading -->
    <text x="0" y="132" class="brand-banking" font-size="138" fill="#0B2046" letter-spacing="1.5">BANKING</text>

    <!-- Red Banner: "TAYARI NEPAL" -->
    <rect x="0" y="156" width="675" height="84" rx="5" fill="#C8102E" />
    <text x="337" y="218" class="brand-tayari" font-size="48" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">TAYARI NEPAL</text>

    <!-- Bottom Motto: PREPARE | PRACTICE | SUCCEED -->
    <g transform="translate(10, 260)">
      <!-- 1. PREPARE -->
      <g transform="translate(0, 0)">
        <circle cx="28" cy="28" r="28" fill="none" stroke="#0B2046" stroke-width="4.5" />
        <!-- Open book icon inside circle -->
        <path d="M 16 21 C 21 19, 26 20, 28 22 C 30 20, 35 19, 40 21 L 40 37 C 35 35, 30 36, 28 38 C 26 36, 21 35, 16 37 Z" 
              fill="#0B2046" />
        <line x1="28" y1="22" x2="28" y2="38" stroke="#FFFFFF" stroke-width="2" />
        <text x="70" y="37" class="brand-motto" font-size="25" fill="#0B2046" letter-spacing="2">PREPARE</text>
      </g>

      <!-- Vertical Divider 1 -->
      <line x1="228" y1="6" x2="228" y2="50" stroke="#0B2046" stroke-width="2.5" />

      <!-- 2. PRACTICE -->
      <g transform="translate(250, 0)">
        <circle cx="28" cy="28" r="28" fill="none" stroke="#C8102E" stroke-width="4.5" />
        <!-- Fountain pen writing swoop inside circle -->
        <path d="M 38 16 L 41 19 L 26 34 L 19 37 L 22 30 Z" fill="#0B2046" />
        <path d="M 17 38 C 23 36, 31 38, 38 33" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-linecap="round" />
        <text x="70" y="37" class="brand-motto" font-size="25" fill="#0B2046" letter-spacing="2">PRACTICE</text>
      </g>

      <!-- Vertical Divider 2 -->
      <line x1="482" y1="6" x2="482" y2="50" stroke="#C8102E" stroke-width="2.5" />

      <!-- 3. SUCCEED -->
      <g transform="translate(504, 0)">
        <circle cx="28" cy="28" r="28" fill="none" stroke="#0B2046" stroke-width="4.5" />
        <!-- Rising bar chart + arrow -->
        <rect x="18" y="31" width="4.5" height="10" fill="#0B2046" rx="1" />
        <rect x="25.5" y="24" width="4.5" height="17" fill="#0B2046" rx="1" />
        <rect x="33" y="17" width="4.5" height="24" fill="#0B2046" rx="1" />
        <path d="M 18 24 L 28 16 L 39 12 M 34 12 L 39 12 L 39 17" fill="none" stroke="#0B2046" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="70" y="37" class="brand-motto" font-size="25" fill="#0B2046" letter-spacing="2">SUCCEED</text>
      </g>
    </g>
  </g>
</svg>
